version: "3.1"

rules:

- rule: start telegram chat
  steps:
  - intent: start
  - action: utter_greet_telegram

- rule: Greeting rule
  steps:
  - intent: greet
  - action: utter_greet

- rule: Goodbye rule
  steps:
  - intent: goodbye
  - action: utter_goodbye_pos

- rule: Fallback handler - Ask the user to repeat or change in a covered topic
  steps:
  - intent: nlu_fallback
  - action: utter_nlu_fallback

# === MONITORAGGIO ===
- rule: rispondi a richiesta di monitoraggio produzione
  steps:
  - intent: check_production
  - action: answer_monitoring_request

- rule: rispondi a richiesta di monitoraggio consumo
  steps:
  - intent: check_consumption
  - action: answer_monitoring_request


# === PREVISIONE (forecast) ===
- rule: rispondi a richiesta di previsione netload
  steps:
  - intent: ask_netload_forecast
  - action: answer_netload_forecast_request


# === OTTIMIZZAZIONE ===
- rule: rispondi a richiesta di ottimizzazione
  steps:
  - intent: ask_optimization
  - action: answer_optimization_request


# === VINCOLI (constraints) ===
#- rule: applica vincoli di ottimizzazione
#  steps:
#  - intent: set_constraints
#  - action: answer_optimization_request


# === CONSIGLIO DI VENDITA ===
- rule: rispondi a richiesta di consiglio vendita
  steps:
  - intent: ask_selling_advice
  - action: answer_selling_advice_request


# === OTTIMIZZAZIONE CON DEVICE ===
- rule: ottimizzazione con dispositivo specifico
  condition:
  - slot_was_set:
    - device_name
  steps:
  - intent: ask_optimization
  - action: answer_optimization_request


# === CHIUSURA CONVERSAZIONE ===
- rule: chiusura conversazione
  steps:
  - intent: deny
  - action: utter_goodbye_pos
