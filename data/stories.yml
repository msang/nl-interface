version: "3.1"

stories:

# === MONITORAGGIO ===
- story: monitoraggio consumo
  steps:
  - intent: check_consumption
  - action: answer_monitoring_request

- story: monitoraggio produzione
  steps:
  - intent: check_production
  - action: answer_monitoring_request


# === PREVISIONE (consumo o produzione) ===
- story: previsione netload dopo monitoraggio
  steps:
  - intent: check_consumption
  - action: answer_monitoring_request
  - intent: ask_netload_forecast
  - action: answer_netload_forecast_request


# === OTTIMIZZAZIONE ===
- story: ottimizzazione diretta
  steps:
  - intent: ask_optimization
  - action: answer_optimization_request

- story: ottimizzazione dopo monitoraggio
  steps:
  - intent: check_production
  - action: answer_monitoring_request
  - intent: ask_optimization
  - action: answer_optimization_request

- story: ottimizzazione dopo previsione
  steps:
  - intent: ask_netload_forecast
  - action: answer_netload_forecast_request
  - intent: ask_optimization
  - action: answer_optimization_request


