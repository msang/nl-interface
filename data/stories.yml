# === CONSULENZA DI VENDITA ===
- story: richiesta consiglio vendita dopo ottimizzazione
  steps:
  - intent: ask_optimization
  - action: answer_optimization_request
  - intent: ask_selling_advice
  - action: answer_selling_advice_request

- story: richiesta consiglio vendita dopo monitoraggio
  steps:
  - intent: check_production
  - action: answer_monitoring_request
  - intent: ask_selling_advice
  - action: answer_selling_advice_request


# === FLUSSI COMPLETI ===
- story: flusso previsionale completo
  steps:
  - intent: check_consumption
  - action: answer_monitoring_request
  - intent: ask_netload_forecast
  - action: answer_netload_forecast_request
  - intent: ask_optimization
  - action: answer_optimization_request
  - intent: ask_selling_advice
  - action: answer_selling_advice_request
  #- action: utter_goodbye_pos

- story: flusso completo da consumo a vendita
  steps:
  - intent: check_consumption
  - action: answer_monitoring_request
  - intent: check_production
  - action: answer_monitoring_request
  - intent: ask_selling_advice
  - action: answer_selling_advice_request
  #- action: utter_goodbye_pos


