version: ' 3.1'
intents:
- affirm
- ask_optimization:
    use_entities: true
- check_consumption
- check_production
- ask_netload_forecast
- deny
- goodbye
- greet
- nlu_fallback
- set_constraints
- start
entities:
- appliance
- constr_time
- source
slots:
  source_name:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: source
  device_name:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: appliance
responses:
  utter_greet:
  - text: Ciao, in cosa posso esserti utile?
  utter_goodbye_pos:
  - text: Va bene. Ciao, alla prossima
  utter_greet_telegram:
  - text: ciao, mi chiamo Energy Feedbot e posso aiutarti nella gestione dei tuoi consumi domestici
  utter_nlu_fallback:
  - text: Mi dispiace, non ho capito la tua richiesta. Puoi riformularla o chiedermi informazioni sui consumi, produzione o ottimizzazione energetica?
actions:
- answer_optimization_request
- answer_monitoring_request
- answer_netload_forecast_request
- utter_goodbye_pos
- utter_greet
- utter_greet_telegram
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
config:
  store_entities_as_slots: true
